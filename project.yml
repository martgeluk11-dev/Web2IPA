name: Web2IPA
options:
  bundleIdPrefix: com.web2ipa
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
targets:
  Web2IPA:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.web2ipa.wrapper
        INFOPLIST_KEY_WEB2IPA_START_URL: "https://example.com"
        SUPPORTS_MACCATALYST: NO
